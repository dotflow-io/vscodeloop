name: Setup Node
description: Setup Node.js with npm caching

inputs:
  node-version:
    description: Node version to use
    required: false
    default: "20"

runs:
  using: composite
  steps:
    - name: 📦 Set up Node ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: ⚙️ Install dependencies
      shell: bash
      run: npm ci
