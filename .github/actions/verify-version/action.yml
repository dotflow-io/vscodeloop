name: Verify Version
description: Verify package.json/package-lock.json version matches the expected tag

inputs:
  expected:
    description: Expected version to check against (defaults to package.json version)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: 🔍 Verify version
      shell: bash
      run: |
        EXPECTED="${{ inputs.expected }}"
        EXPECTED="${EXPECTED#v}"
        if [ -z "$EXPECTED" ]; then
          EXPECTED=$(node -p "require('./package.json').version")
        fi

        PKG_VERSION=$(node -p "require('./package.json').version")
        LOCK_VERSION=$(node -p "require('./package-lock.json').version")

        echo "Expected version: $EXPECTED"
        echo "package.json: $PKG_VERSION"
        echo "package-lock.json: $LOCK_VERSION"

        if [ "$PKG_VERSION" != "$EXPECTED" ] || [ "$LOCK_VERSION" != "$EXPECTED" ]; then
          echo "ERROR: Version mismatch!"
          exit 1
        fi
